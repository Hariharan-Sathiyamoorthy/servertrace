<!doctype html>
{% load static %}
<html data-bs-theme="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
    <title>IT System Logger</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/united/bootstrap.min.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@200;300;400;500;600;700&amp;display=swap" />
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.12.0/css/all.css">
    <link rel="stylesheet" href="{% static 'assets/css/Features-Large-Icons-icons.css' %}" />
    <link rel="stylesheet" href="{% static 'assets/css/Pricing-Duo-badges.css' %}" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

</head>

<body>

    <style>
        .bottom-alert {
            position: fixed;
            bottom: 0;
            right: 0;
            margin: 10px;
            z-index: 9999;
            /* Ensure it sits on top */
        }

        .cream-background {
            background-color: #F1F0E8 !important;
            /* This is a cream color */
        }

        .navbar {
            background-color: #F1F0E8 !important;

        }
    </style>
    {% if request.user.is_authenticated %}
    <nav class="navbar navbar-expand-md navbar-light py-3">
        <div class="container d-flex justify-content-between">
            <a class="navbar-brand d-flex align-items-center" href="{% url 'core:dashboard' %}">
                <span
                    class="bs-icon-sm bs-icon-rounded bs-icon-primary d-flex justify-content-center align-items-center me-2 bs-icon"><svg
                        xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor"
                        viewBox="0 0 16 16" class="bi bi-bezier">
                        <path fill-rule="evenodd"
                            d="M0 10.5A1.5 1.5 0 0 1 1.5 9h1A1.5 1.5 0 0 1 4 10.5v1A1.5 1.5 0 0 1 2.5 13h-1A1.5 1.5 0 0 1 0 11.5zm1.5-.5a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5zm10.5.5A1.5 1.5 0 0 1 13.5 9h1a1.5 1.5 0 0 1 1.5 1.5v1a1.5 1.5 0 0 1-1.5 1.5h-1a1.5 1.5 0 0 1-1.5-1.5zm1.5-.5a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5zM6 4.5A1.5 1.5 0 0 1 7.5 3h1A1.5 1.5 0 0 1 10 4.5v1A1.5 1.5 0 0 1 8.5 7h-1A1.5 1.5 0 0 1 6 5.5zM7.5 4a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5z">
                        </path>
                        <path
                            d="M6 4.5H1.866a1 1 0 1 0 0 1h2.668A6.517 6.517 0 0 0 1.814 9H2.5c.123 0 .244.015.358.043a5.517 5.517 0 0 1 3.185-3.185A1.503 1.503 0 0 1 6 5.5zm3.957 1.358A1.5 1.5 0 0 0 10 5.5v-1h4.134a1 1 0 1 1 0 1h-2.668a6.517 6.517 0 0 1 2.72 3.5H13.5c-.123 0-.243.015-.358.043a5.517 5.517 0 0 0-3.185-3.185z">
                        </path>
                    </svg>
                </span>
                <span>ServerTrace</span>
            </a>
            <button data-bs-toggle="collapse" class="navbar-toggler" data-bs-target="#navcol-2">
                <span class="visually-hidden">Toggle navigation</span><span class="navbar-toggler-icon">
                </span>
            </button>
            <div class="navbar-collapse collapse" id="navcol-2">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="{% url 'core:dashboard' %}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="{% url 'core:get_servers' %}">Server</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="{% url 'core:logs' %}">Issues</a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="{% url 'users:profile' %}">{{request.user.userprofile}}</a>
                    <li class="nav-item ml-auto">
                        <a class="btn btn-primary ms-md-2" role="button" href="{% url  'users:logout' %}">
                            <i class="fas fa-sign-out-alt"></i> 
                        </a>
                    </li>
                </ul>

                
            </div>
        </div>
    </nav>
    {% endif %}
    {% for message in messages %}
    <div class="container d-flex bottom-alert">
        <div class="alert {{ message.tags }} alert-dismissible shadow fade show " role="alert">
            <button type="button" class="btn close" data-bs-dismiss="alert" aria-label="Close">
                <i class="fas fa-trash"></i>
            </button>
            {{ message | safe }}
        </div>

    </div>

    {% endfor %}
    <!-- Navbar -->

    {% block content %}

    {% endblock %}
    <!-- <script src="assets/bootstrap/js/bootstrap.min.js"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.8.0/Chart.bundle.min.js"></script>
    <script src="{% static 'assets/js/bs-init.js' %}"></script>
</body>

</html>
