{% extends 'main.html' %}

{% block content %}
<div class="container">
    <div class="card">
        <div class="card-header">
            <h5>Create Instance</h5>
        </div>
        <div class="card-body">
            <h6 class="card-subtitle mb-2 text-body-secondary"></h6>
            <form method="POST" autocomplete="off">
                {% csrf_token %}
                {% for field in form %}
                <div class="form-floating mb-3">
                    {{field}}
                    <label>{{field.label}}</label>
                    {% for error in field.errors %}
                    <p class="invalid-feedback">{{ error|escape }}</p>
                    {% endfor %}
                </div>
                
                {% endfor %}
                <div class="mt-3 d-flex justify-content-center"><button class="btn btn-primary d-block w-30" type="submit"
                    value="Launch">Launch Instance</button></div>
            </form>

        </div>
    </div>

</div>


{% endblock %}
